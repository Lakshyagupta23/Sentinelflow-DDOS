version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ddos_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ddos_detection
    ports:
      - "3306:3306"
    volumes:
      - ddos_mysql_data:/var/lib/mysql

volumes:
  ddos_mysql_data:
